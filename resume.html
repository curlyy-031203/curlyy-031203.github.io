<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-zh="廖思嘉 · 简历" data-en="Liao Sijia · Resume">廖思嘉 · 简历</title>
  <meta name="description"
    data-zh="廖思嘉的简历——教育科技方向硕士，求职意向产品 / 运营。"
    data-en="Resume of Liao Sijia — EdTech grad student, seeking Product / Operations roles.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* 简历 PDF 展示页专用样式 */
    .resume-viewer-wrap {
      max-width: var(--wide-w);
      margin: 0 auto;
      padding: var(--space-12) var(--space-6) var(--space-20);
    }
    .resume-viewer-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--space-4);
      margin-bottom: var(--space-8);
    }
    .resume-viewer-title {
      font-family: var(--font-display);
      font-size: clamp(28px, 4vw, 40px);
      letter-spacing: -0.025em;
      font-weight: 600;
    }
    .resume-viewer-sub {
      font-size: 15px;
      color: var(--text-secondary);
      margin-top: var(--space-2);
    }
    .resume-viewer-actions {
      display: flex;
      gap: var(--space-3);
      flex-wrap: wrap;
    }
    .resume-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: 0.02em;
      transition: all 200ms var(--ease-out);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      white-space: nowrap;
    }
    .resume-btn:hover { border-color: var(--border-strong); transform: translateY(-1px); }
    .resume-btn.primary {
      background: var(--text);
      color: var(--surface);
      border-color: var(--text);
    }
    .resume-btn.primary:hover { background: #333; }
    .resume-btn svg { width: 15px; height: 15px; }
    .resume-frame {
      width: 100%;
      height: 1180px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-soft);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }
    .resume-frame iframe,
    .resume-frame embed {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    /* 移动端：PDF 内嵌在手机上体验差，给一个醒目的打开按钮兜底 */
    .resume-mobile-hint {
      display: none;
      margin-top: var(--space-4);
      font-size: 13px;
      color: var(--text-tertiary);
      text-align: center;
    }
    @media (max-width: 720px) {
      .resume-frame { height: 70vh; }
      .resume-mobile-hint { display: block; }
    }
  </style>
</head>
<body>

  <header class="nav">
    <div class="nav-inner">
      <a href="index.html#top" class="nav-logo">Liao Sijia / 廖思嘉</a>
      <nav class="nav-links" aria-label="Main">
        <a href="index.html#about" class="nav-link" data-zh="关于" data-en="About">关于</a>
        <a href="index.html#work" class="nav-link" data-zh="案例" data-en="Work">案例</a>
        <a href="resume.html" class="nav-link" data-zh="简历" data-en="Resume">简历</a>
      </nav>
      <div class="nav-right">
        <button class="lang-toggle" aria-label="Switch language">EN</button>
      </div>
    </div>
  </header>

  <main class="resume-viewer-wrap">
    <div class="resume-viewer-head">
      <div>
        <h1 class="resume-viewer-title" data-zh="简历" data-en="Resume">简历</h1>
        <p class="resume-viewer-sub"
          data-zh="廖思嘉 · 教育科技方向硕士 · 求职意向：产品 / 运营"
          data-en="Liao Sijia · EdTech master's · Seeking Product / Operations">
          廖思嘉 · 教育科技方向硕士 · 求职意向：产品 / 运营
        </p>
      </div>
      <div class="resume-viewer-actions">
        <a class="resume-btn primary" href="assets/resume.pdf" download="廖思嘉-简历.pdf">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M8 2v8M8 10L5 7M8 10l3-3"/><path d="M3 13h10"/>
          </svg>
          <span data-zh="下载 PDF" data-en="Download PDF">下载 PDF</span>
        </a>
        <a class="resume-btn" href="assets/resume.pdf" target="_blank" rel="noopener">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M6 3H3v10h10v-3"/><path d="M9 3h4v4"/><path d="M13 3L7 9"/>
          </svg>
          <span data-zh="新窗口打开" data-en="Open in new tab">新窗口打开</span>
        </a>
        <a class="resume-btn" href="index.html#work">
          <span data-zh="← 返回作品集" data-en="← Back to Portfolio">← 返回作品集</span>
        </a>
      </div>
    </div>

    <div class="resume-frame">
      <!-- 直接嵌入原始 PDF，内容 100% 为你的原件，未做任何改动 -->
      <iframe src="assets/resume.pdf#toolbar=1&navpanes=0&view=FitH"
              title="廖思嘉简历 PDF"
              loading="lazy"></iframe>
    </div>
    <p class="resume-mobile-hint"
       data-zh="手机上预览可能不清晰，建议点上方「下载 PDF」或「新窗口打开」查看完整简历。"
       data-en="On mobile the preview may be small — tap “Download PDF” or “Open in new tab” above for the full resume.">
      手机上预览可能不清晰，建议点上方「下载 PDF」或「新窗口打开」查看完整简历。
    </p>
  </main>

  <footer class="footer">
    <div class="wrap-wide">
      <div class="footer-inner">
        <div>
          <span data-zh="© 2026 廖思嘉" data-en="© 2026 Liao Sijia">© 2026 廖思嘉</span>
        </div>
        <div style="display:flex; gap:24px;">
          <a href="mailto:3120252027@bit.edu.cn">3120252027@bit.edu.cn</a>
          <a href="https://github.com/curlyy-031203" target="_blank" rel="noopener">github.com/curlyy-031203</a>
          <a href="index.html#top" data-zh="作品集 →" data-en="Portfolio →">作品集 →</a>
        </div>
      </div>
    </div>
  </footer>

  <script>
  (function () {
    'use strict';
    var lang = 'zh';
    var btn = document.querySelector('.lang-toggle');
    function applyLang(l) {
      lang = l;
      document.documentElement.setAttribute('lang', l === 'zh' ? 'zh-CN' : 'en');
      document.querySelectorAll('[data-zh][data-en]').forEach(function (el) {
        var v = el.getAttribute(l === 'zh' ? 'data-zh' : 'data-en');
        if (v !== null) { el.textContent = v; }
      });
      if (btn) { btn.textContent = (l === 'zh') ? 'EN' : '中'; }
      var t = document.querySelector('title[data-zh][data-en]');
      if (t) { document.title = t.getAttribute(l === 'zh' ? 'data-zh' : 'data-en'); }
    }
    if (btn) { btn.addEventListener('click', function () { applyLang(lang === 'zh' ? 'en' : 'zh'); }); }
    applyLang('zh');
  })();
  </script>
</body>
</html>
