<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案 2 · 作品谱系交互图 · 廖思嘉</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@600;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0c0a09;--ink:#ece6df;--ink-soft:#a89f94;--ink-faint:#766c62;--accent:#d4663c;--accent-bright:#e8855a;--teal:#5ab3a4;--line:rgba(226,196,170,.14);--line2:rgba(226,196,170,.26);--maxw:1140px}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{min-height:100vh;background:var(--bg);color:var(--ink);overflow-x:hidden;cursor:none;font-family:"Noto Sans SC",sans-serif;font-weight:300;line-height:1.9;font-size:16px;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(46% 60% at 80% 40%,rgba(212,102,60,.08),transparent 72%)}
  a{cursor:none;color:inherit;text-decoration:none}
  .scrim{position:fixed;inset:0;z-index:0;pointer-events:none}
  nav,header{position:relative;z-index:3}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 30px}
  .mono{font-family:"JetBrains Mono",monospace}
  .cur-ring{position:fixed;top:0;left:0;width:30px;height:30px;border:1px solid var(--accent);border-radius:50%;z-index:95;pointer-events:none;transform:translate(-50%,-50%);opacity:.7}
  .cur-dot{position:fixed;top:0;left:0;width:4px;height:4px;background:var(--accent-bright);border-radius:50%;z-index:96;pointer-events:none;transform:translate(-50%,-50%)}
  nav{backdrop-filter:blur(10px);background:rgba(12,10,9,.55);border-bottom:1px solid var(--line)}
  nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
  nav .name{font-size:15px}nav .name b{font-weight:500}
  nav .links{display:flex;gap:26px;font-size:14px;color:var(--ink-soft)}nav .links a:hover{color:var(--accent)}
  header{padding:96px 0 80px}
  .hero-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:44px;align-items:center}
  @media(max-width:900px){.hero-grid{grid-template-columns:1fr;gap:30px}header{padding:80px 0 60px}}
  .badge{display:inline-block;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);border:1px solid var(--line2);border-radius:100px;padding:5px 12px;margin-bottom:22px}
  .status{display:flex;align-items:center;gap:10px;font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:1px;color:var(--ink-soft);text-transform:uppercase;margin-bottom:26px}
  .status .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 9px var(--teal);animation:pulse 2.6s infinite}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
  h1{font-family:"Noto Serif SC",serif;font-weight:700;font-size:clamp(52px,7vw,88px);line-height:1;letter-spacing:-.02em;color:var(--ink);margin-bottom:8px}
  .term{margin-top:20px;display:inline-flex;align-items:baseline;font-family:"JetBrains Mono",monospace;font-size:clamp(14px,1.6vw,18px);color:var(--ink);background:rgba(8,7,14,.5);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
  .term .pr{color:var(--accent);margin-right:6px}
  .term .caret{display:inline-block;width:8px;height:1.05em;background:var(--accent);vertical-align:-2px;margin-left:5px;box-shadow:0 0 8px var(--accent);animation:blink 1.05s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .lede{font-size:clamp(16px,1.7vw,18px);color:var(--ink-soft);max-width:48ch;margin-top:24px;line-height:1.7}
  .actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px;align-items:center}
  .btn{font-family:"JetBrains Mono",monospace;font-size:13px;padding:12px 20px;border-radius:8px;transition:.25s}
  .btn-primary{background:var(--accent);color:#1a0d07;font-weight:500;will-change:transform}.btn-primary:hover{background:var(--accent-bright)}
  .btn-ghost{border:1px solid var(--line2);color:var(--ink-soft)}.btn-ghost:hover{color:var(--ink);border-color:var(--ink-soft)}
  .graph-panel{position:relative;height:480px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(20,16,14,.5),rgba(12,10,9,.3));overflow:hidden}
  @media(max-width:900px){.graph-panel{height:400px}}
  #graph{display:block;width:100%;height:100%;cursor:none}
  .gp-tag{position:absolute;top:14px;left:16px;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:1px;color:var(--ink-faint);text-transform:uppercase}
  .gp-hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-faint)}
  @media(prefers-reduced-motion:reduce){body,a{cursor:auto}#graph{cursor:auto}.cur-ring,.cur-dot{display:none}}
</style>
</head>
<body>
<div class="cur-ring" id="ring"></div><div class="cur-dot" id="dot"></div>

<nav><div class="wrap"><span class="name"><b>廖思嘉</b>&nbsp;&nbsp;Liao Sijia</span>
  <div class="links"><a href="#">关于</a><a href="#">案例</a><a href="#">作品体</a><a href="#">简历</a></div></div></nav>

<header><div class="wrap"><div class="hero-grid">
  <div class="hero-text">
    <span class="badge mono">方案 2 · 作品谱系交互图</span>
    <div class="status mono"><i class="dot"></i>5 services live · github pages / vercel / streamlit</div>
    <h1>廖思嘉</h1>
    <div class="term"><span class="pr">~</span><span class="type">把判断直接变成可运行的原型</span><span class="caret"></span></div>
    <p class="lede">教育科技方向硕士。这五个工具不是清单，是一条谱系——同一个本能在不同资源上的实践。拖动看看它们怎么连在一起。</p>
    <div class="actions"><a class="btn btn-primary" href="#">看核心案例 →</a><a class="btn btn-ghost" href="#">查看简历</a></div>
  </div>
  <div class="graph-panel">
    <span class="gp-tag">作品体 / works graph</span>
    <canvas id="graph"></canvas>
    <span class="gp-hint mono">拖动节点 · 悬停查看角色</span>
  </div>
</div></div></header>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrambleTextPlugin.min.js"></script>
<script>
var REDUCE=false;try{REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}

/* ===== Interactive works-graph: 5 tools, spring physics, draggable ===== */
(function(){
  var cv=document.getElementById('graph');if(!cv)return;var ctx=cv.getContext('2d');
  var dpr=Math.min(window.devicePixelRatio||1,2),W=0,H=0;
  var nodes=[
    {id:'split',label:'名单拆分工具',sub:'导入端',type:'work',hx:.20,hy:.30},
    {id:'merge',label:'成绩汇总工具',sub:'汇总端',type:'work',hx:.20,hy:.72},
    {id:'hinge',label:'AI 使用者测试',sub:'枢纽 · 研究 × 产品',type:'hinge',hx:.54,hy:.51},
    {id:'eng',label:'English House',sub:'英语学习',type:'self',hx:.84,hy:.30},
    {id:'mind',label:'念头分拣器',sub:'情绪 / 认知',type:'self',hx:.84,hy:.72}
  ];
  var byId={};nodes.forEach(function(n){byId[n.id]=n;});
  var edges=[['split','merge',true],['split','hinge',false],['merge','hinge',false],['hinge','eng',false],['hinge','mind',false]];
  var COL={work:'#d4663c',hinge:'#e8855a',self:'#5ab3a4'};
  var FILL={work:'#241a16',hinge:'#2a1a12',self:'#16201d'};
  var mouse={x:-9999,y:-9999,down:false},drag=null,hover=null,t0=performance.now();

  function size(){var r=cv.getBoundingClientRect();W=cv.width=Math.max(1,r.width*dpr);H=cv.height=Math.max(1,r.height*dpr);
    nodes.forEach(function(n){n.HX=n.hx*W;n.HY=n.hy*H; if(n.x===undefined){n.x=W/2+(Math.random()-.5)*W*0.5;n.y=H/2+(Math.random()-.5)*H*0.5;n.vx=0;n.vy=0;}});}
  function chip(n){ctx.font='600 '+(14*dpr)+'px "Noto Sans SC",sans-serif';var w=ctx.measureText(n.label).width+34*dpr;return {w:w,h:34*dpr};}
  function toCv(e){var r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*dpr,y:(e.clientY-r.top)*dpr};}
  function hit(p){for(var i=nodes.length-1;i>=0;i--){var n=nodes[i],c=chip(n);if(Math.abs(p.x-n.x)<c.w/2&&Math.abs(p.y-n.y)<c.h/2+6*dpr)return n;}return null;}

  cv.addEventListener('mousedown',function(e){var p=toCv(e);var n=hit(p);if(n){drag=n;mouse.down=true;}});
  window.addEventListener('mousemove',function(e){var p=toCv(e);mouse.x=p.x;mouse.y=p.y;if(drag){drag.x=p.x;drag.y=p.y;drag.vx=0;drag.vy=0;}else{hover=hit(p);}});
  window.addEventListener('mouseup',function(){drag=null;mouse.down=false;});
  cv.addEventListener('mouseleave',function(){mouse.x=mouse.y=-9999;if(!mouse.down)hover=null;});

  function physics(){
    for(var i=0;i<nodes.length;i++){var n=nodes[i];if(n===drag)continue;
      var fx=(n.HX-n.x)*0.020,fy=(n.HY-n.y)*0.020;                 // spring to home (keeps it readable)
      for(var j=0;j<nodes.length;j++){if(i===j)continue;var m=nodes[j];var dx=n.x-m.x,dy=n.y-m.y,d2=dx*dx+dy*dy;var d=Math.sqrt(d2)||1;
        var rep=Math.min(1.2,(9000*dpr*dpr)/d2);fx+=dx/d*rep;fy+=dy/d*rep;}                 // mutual repulsion
      if(mouse.x>-999){var mdx=n.x-mouse.x,mdy=n.y-mouse.y,md=Math.hypot(mdx,mdy);if(md<90*dpr){var f=(1-md/(90*dpr))*1.4;fx+=mdx/(md||1)*f;fy+=mdy/(md||1)*f;}}
      n.vx=(n.vx+fx)*0.86;n.vy=(n.vy+fy)*0.86;n.x+=n.vx;n.y+=n.vy;
    }
    // edge springs (tug when dragging)
    edges.forEach(function(e){var a=byId[e[0]],b=byId[e[1]];var dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;
      var rest=Math.hypot(b.HX-a.HX,b.HY-a.HY);var f=(d-rest)*0.012;var ux=dx/d*f,uy=dy/d*f;
      if(a!==drag){a.vx+=ux;a.vy+=uy;}if(b!==drag){b.vx-=ux;b.vy-=uy;}});
  }
  function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

  function draw(now){
    ctx.clearRect(0,0,W,H);
    // edges
    edges.forEach(function(e){var a=byId[e[0]],b=byId[e[1]];
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
      ctx.strokeStyle=e[2]?'rgba(212,102,60,.55)':'rgba(226,196,170,.18)';ctx.lineWidth=(e[2]?2:1)*dpr;ctx.stroke();
      if(e[2]){var tt=((now*0.00018)%1);var px=a.x+(b.x-a.x)*tt,py=a.y+(b.y-a.y)*tt;ctx.beginPath();ctx.arc(px,py,2.6*dpr,0,6.28);ctx.fillStyle='#e8855a';ctx.fill();}
    });
    // nodes
    nodes.forEach(function(n){var c=chip(n),w=c.w,h=c.h,x=n.x-w/2,y=n.y-h/2;var on=(n===hover||n===drag);
      if(on){ctx.shadowColor=COL[n.type];ctx.shadowBlur=18*dpr;}else{ctx.shadowBlur=0;}
      roundRect(x,y,w,h,h/2);ctx.fillStyle=FILL[n.type];ctx.fill();
      ctx.lineWidth=(on?2:1.3)*dpr;ctx.strokeStyle=COL[n.type];ctx.stroke();ctx.shadowBlur=0;
      ctx.font='600 '+(14*dpr)+'px "Noto Sans SC",sans-serif';ctx.fillStyle='#ece6df';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(n.label,n.x,n.y);
      if(on){ctx.font='400 '+(11*dpr)+'px "JetBrains Mono",monospace';ctx.fillStyle=COL[n.type];ctx.fillText(n.sub,n.x,n.y+h/2+12*dpr);}
    });
  }
  function loop(now){if(!REDUCE)physics();draw(now);requestAnimationFrame(loop);}
  function entrance(){ // nodes fly from center to home
    nodes.forEach(function(n,i){n.x=W/2;n.y=H/2;n.vx=0;n.vy=0;});
  }
  function start(){size();entrance();requestAnimationFrame(loop);
    var rt;addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){nodes.forEach(function(n){n.x=undefined;});size();},200);});}
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(start);else setTimeout(start,300);
})();

/* cursor + magnetic + decode */
(function(){
  if(REDUCE||!window.gsap)return;
  var ring=document.getElementById('ring'),dot=document.getElementById('dot');
  var rx=gsap.quickTo(ring,'x',{duration:.4,ease:'power3'}),ry=gsap.quickTo(ring,'y',{duration:.4,ease:'power3'});
  var dx=gsap.quickTo(dot,'x',{duration:.12,ease:'power3'}),dy=gsap.quickTo(dot,'y',{duration:.12,ease:'power3'});
  addEventListener('mousemove',function(e){rx(e.clientX);ry(e.clientY);dx(e.clientX);dy(e.clientY);});
  document.querySelectorAll('a,.btn').forEach(function(el){el.addEventListener('mouseenter',function(){gsap.to(ring,{scale:1.7,duration:.3});});el.addEventListener('mouseleave',function(){gsap.to(ring,{scale:1,duration:.3});});});
  var mag=document.querySelector('.btn-primary');var mxT=gsap.quickTo(mag,'x',{duration:.4,ease:'power3'}),myT=gsap.quickTo(mag,'y',{duration:.4,ease:'power3'});
  mag.addEventListener('mousemove',function(e){var r=mag.getBoundingClientRect();mxT((e.clientX-(r.left+r.width/2))*.4);myT((e.clientY-(r.top+r.height/2))*.4);});
  mag.addEventListener('mouseleave',function(){mxT(0);myT(0);});
  if(window.ScrambleTextPlugin){gsap.registerPlugin(window.ScrambleTextPlugin);
    var ty=document.querySelector('.type'),txt=ty.textContent;
    var go=function(){gsap.from('.hero-text h1',{opacity:0,y:28,duration:1,ease:'expo.out'});
      gsap.from('.graph-panel',{opacity:0,duration:1.1,ease:'power2.out'});
      gsap.to(ty,{duration:1.5,delay:.4,scrambleText:{text:txt,chars:'01<>/{}#你他用是',speed:.5,revealDelay:.1}});};
    if(document.fonts&&document.fonts.ready)document.fonts.ready.then(go);else go();}
})();
</script>
</body>
</html>
